name: Template checks
on: [push, pull_request, workflow_dispatch]
jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
      - run: node check-template.mts
