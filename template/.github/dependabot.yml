version: 2
# Batch routine updates monthly; security updates and automatic rebases stay enabled.
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 2
    directory: /
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: uv
    open-pull-requests-limit: 2
    directory: /deployment
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: docker
    open-pull-requests-limit: 2
    directories:
      - /backend
      - /e2e_tests
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Shared deployment workflow pins are maintained through startup sync.
      - dependency-name: '*/deploy-your-startup/*'
    groups:
      routine-updates:
        patterns: ['*']
        update-types: ['minor', 'patch']
